name: Release

# Modelo: release por branch dedicada (ADR-0001 Addendum 2026-04-22)
#
# Trigger: push em branch `releases/<package>/v<version>`.
# Exemplos:
#   - releases/typescript-common-types/v1.0.0       -> dist-tag: latest
#   - releases/typescript-common-types/v1.1.0-rc.1  -> dist-tag: rc
#   - releases/typescript-common-errors/v0.2.0-next.3 -> dist-tag: next
#
# Cada branch publica EXATAMENTE UM pacote. Cascatas inter-pacote exigem
# branches sequenciais, conforme documentado no ADR.
#
# IDEMPOTÊNCIA: cada step "destrutivo" é guardado por uma checagem de estado
# (tag git, versão no npm, GitHub Release, back-merge PR). Re-rodar o workflow
# na mesma release branch é seguro — steps já cumpridos viram no-op silencioso.

on:
  push:
    branches:
      - 'releases/*/v*'

permissions:
  contents: write
  id-token: write
  pull-requests: write

env:
  NODE_VERSION: '22'

jobs:
  release:
    name: Validate, Version, Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Parse release branch
        id: parse
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          if [[ ! "$BRANCH" =~ ^releases/([^/]+)/v(.+)$ ]]; then
            echo "::error::Branch '$BRANCH' não casa o padrão releases/<package>/v<version>"
            exit 1
          fi
          PACKAGE="${BASH_REMATCH[1]}"
          VERSION="${BASH_REMATCH[2]}"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "::notice::Release alvo: $PACKAGE@$VERSION (branch $BRANCH)"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Validate package exists in workspace
        run: |
          if ! npx nx show project ${{ steps.parse.outputs.package }} > /dev/null 2>&1; then
            echo "::error::Projeto '${{ steps.parse.outputs.package }}' não existe no workspace Nx"
            exit 1
          fi

      - name: Lint package
        run: npx nx run ${{ steps.parse.outputs.package }}:lint

      - name: Test package
        run: npx nx run ${{ steps.parse.outputs.package }}:test

      - name: Build package
        run: npx nx run ${{ steps.parse.outputs.package }}:build

      - name: Check release state (idempotency)
        id: state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PKG="${{ steps.parse.outputs.package }}"
          VER="${{ steps.parse.outputs.version }}"
          NPM_PKG="@bhs-dev/$PKG"
          TAG="$PKG@$VER"
          BRANCH="${{ steps.parse.outputs.branch }}"

          # Tag git (remoto) — fonte de verdade pra "release commit já existe"
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q "$TAG"; then
            TAG_EXISTS=true
          else
            TAG_EXISTS=false
          fi

          # Publicação no npm
          if npm view "$NPM_PKG@$VER" version > /dev/null 2>&1; then
            NPM_PUBLISHED=true
          else
            NPM_PUBLISHED=false
          fi

          # GitHub Release
          if gh release view "$TAG" > /dev/null 2>&1; then
            GH_RELEASE_EXISTS=true
          else
            GH_RELEASE_EXISTS=false
          fi

          # Back-merge PR (qualquer estado: open OR merged)
          PR_STATE=$(gh pr list --head "$BRANCH" --base develop --state all --limit 1 --json state -q '.[0].state' 2>/dev/null || echo "")
          if [ -n "$PR_STATE" ]; then
            BACK_MERGE_PR_EXISTS=true
          else
            BACK_MERGE_PR_EXISTS=false
          fi

          {
            echo "tag_exists=$TAG_EXISTS"
            echo "npm_published=$NPM_PUBLISHED"
            echo "gh_release_exists=$GH_RELEASE_EXISTS"
            echo "back_merge_pr_exists=$BACK_MERGE_PR_EXISTS"
          } >> "$GITHUB_OUTPUT"

          echo "::notice::Estado de ${PKG}@${VER} → tag=${TAG_EXISTS}, npm=${NPM_PUBLISHED}, gh_release=${GH_RELEASE_EXISTS}, back_merge_pr=${BACK_MERGE_PR_EXISTS}"

      - name: Determine dist-tag
        id: tag
        run: |
          VERSION="${{ steps.parse.outputs.version }}"
          if [[ "$VERSION" == *"-"* ]]; then
            SUFFIX="${VERSION#*-}"
            CHANNEL="${SUFFIX%%.*}"
            echo "npm_tag=$CHANNEL" >> "$GITHUB_OUTPUT"
          else
            echo "npm_tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure git
        if: steps.state.outputs.tag_exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Version, changelog, commit & tag
        if: steps.state.outputs.tag_exists == 'false'
        run: |
          npx nx release version ${{ steps.parse.outputs.version }} \
            --projects=${{ steps.parse.outputs.package }} \
            --first-release
          npx nx release changelog ${{ steps.parse.outputs.version }} \
            --projects=${{ steps.parse.outputs.package }} \
            --first-release

      - name: Push commits and tags
        if: steps.state.outputs.tag_exists == 'false'
        run: git push --follow-tags

      - name: Configure npm authentication
        if: steps.state.outputs.npm_published == 'false'
        run: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm
        if: steps.state.outputs.npm_published == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npx nx release publish \
            --projects=${{ steps.parse.outputs.package }} \
            --tag=${{ steps.tag.outputs.npm_tag }} \
            --registry=https://registry.npmjs.org \
            --first-release

      - name: Create GitHub Release
        if: steps.state.outputs.gh_release_exists == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.parse.outputs.package }}@${{ steps.parse.outputs.version }}"
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            --verify-tag

      - name: Open back-merge PR to develop
        if: steps.state.outputs.back_merge_pr_exists == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ steps.parse.outputs.branch }}"
          TITLE="chore(release): back-merge ${{ steps.parse.outputs.package }}@${{ steps.parse.outputs.version }}"
          BODY=$(cat <<EOF
          Back-merge automático após publicação bem-sucedida de \`${{ steps.parse.outputs.package }}@${{ steps.parse.outputs.version }}\`.

          ## Conteúdo

          - Bump de versão no manifest (\`dist/\`)
          - Consumo do version-plan correspondente
          - Changelog gerado pelo Nx Release

          ## Por que este PR existe

          O modelo de release por branch dedicada (ADR-0001 Addendum 2026-04-22) gera os artefatos de versão na branch \`releases/...\`. Este back-merge propaga esses artefatos de volta para \`develop\`, garantindo que:

          - O version-plan consumido não seja recriado por engano em PRs futuras
          - As próximas releases partam do estado atualizado

          ## Pós-merge

          Após o merge, a branch \`$BRANCH\` pode ser deletada — sua finalidade está cumprida.

          ---

          🤖 Criado automaticamente pelo workflow de release.
          EOF
          )
          gh pr create \
            --base develop \
            --head "$BRANCH" \
            --title "$TITLE" \
            --body "$BODY"

      - name: Resumo final
        run: |
          echo "::notice::Release de ${{ steps.parse.outputs.package }}@${{ steps.parse.outputs.version }} concluída."
          echo "  - Tag git:        ${{ steps.state.outputs.tag_exists == 'true' && 'já existia' || 'criada agora' }}"
          echo "  - npm publish:    ${{ steps.state.outputs.npm_published == 'true' && 'já existia' || 'feito agora' }}"
          echo "  - GitHub Release: ${{ steps.state.outputs.gh_release_exists == 'true' && 'já existia' || 'criado agora' }}"
          echo "  - Back-merge PR:  ${{ steps.state.outputs.back_merge_pr_exists == 'true' && 'já existia' || 'aberto agora' }}"
