name: CI

on:
  pull_request:
    branches: ['*']

permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  NODE_VERSION: '22'
  NX_CLOUD_ACCESS_TOKEN: ''
  AR_REGISTRY: us-central1-npm.pkg.dev/homelab-492918/typescript-packages-dev

jobs:
  ci:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Derive NX_BASE for affected commands
        uses: nrwl/nx-set-shas@v4

      - name: Check version plan
        if: github.event_name == 'pull_request'
        run: npx nx release plan:check

      - name: Lint affected
        run: npx nx affected -t lint

      - name: Test affected with coverage
        run: npx nx affected -t test -- --coverage

      - name: Merge coverage reports
        if: always()
        run: |
          mkdir -p coverage/merged
          node <<'EOF'
          const fs = require('fs');
          const path = require('path');

          const summaryFiles = [];
          const metrics = ['lines', 'statements', 'functions', 'branches', 'branchesTrue'];
          const merged = Object.fromEntries(
            metrics.map((metric) => [metric, { total: 0, covered: 0, skipped: 0, pct: 'Unknown' }]),
          );

          function walk(dir) {
            if (!fs.existsSync(dir)) return;

            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const fullPath = path.join(dir, entry.name);

              if (entry.isDirectory()) {
                if (fullPath === path.join('coverage', 'merged')) continue;
                walk(fullPath);
                continue;
              }

              if (entry.name === 'coverage-summary.json') {
                summaryFiles.push(fullPath);
              }
            }
          }

          walk('coverage');

          for (const filePath of summaryFiles) {
            const summary = JSON.parse(fs.readFileSync(filePath, 'utf8')).total ?? {};

            for (const metric of metrics) {
              const current = summary[metric];
              if (!current || typeof current.total !== 'number' || typeof current.covered !== 'number') {
                continue;
              }

              merged[metric].total += current.total;
              merged[metric].covered += current.covered;
              merged[metric].skipped += current.skipped ?? 0;
            }
          }

          for (const metric of metrics) {
            merged[metric].pct =
              merged[metric].total === 0
                ? 'Unknown'
                : Number(((merged[metric].covered / merged[metric].total) * 100).toFixed(2));
          }

          fs.writeFileSync(
            path.join('coverage', 'merged', 'coverage-summary.json'),
            JSON.stringify({ total: merged }, null, 2) + '\n',
          );

          console.log(`Merged ${summaryFiles.length} coverage summaries.`);
          EOF

      - name: Coverage comment on PR
        if: github.event_name == 'pull_request' && always()
        uses: MishaKav/jest-coverage-comment@main
        with:
          title: 'Coverage Report'
          coverage-summary-path: coverage/merged/coverage-summary.json
          junitxml-path: ''

      - name: Build affected
        run: npx nx affected -t build

      - name: Security audit
        run: npm audit --audit-level=high --omit=dev

  publish-dev:
    name: Publish dev artifacts to AR
    needs: ci
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Derive NX_BASE for affected commands
        uses: nrwl/nx-set-shas@v4

      - name: Check affected packages
        id: affected
        run: |
          AFFECTED=$(npx nx show projects --affected --type=lib 2>/dev/null || echo "")
          if [ -z "$AFFECTED" ]; then
            echo "has_affected=false" >> "$GITHUB_OUTPUT"
            echo "No affected packages — skipping publish."
          else
            echo "has_affected=true" >> "$GITHUB_OUTPUT"
            echo "Affected packages: $AFFECTED"
          fi

      - name: Authenticate to GCP (WIF)
        if: steps.affected.outputs.has_affected == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/702302784311/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider
          service_account: github-actions-ci@homelab-492918.iam.gserviceaccount.com

      - name: Compute dev version
        if: steps.affected.outputs.has_affected == 'true'
        id: version
        run: |
          PR_NUM=${{ github.event.pull_request.number }}
          RUN_NUM=${{ github.run_number }}
          DEV_VERSION="0.0.1-dev.pr${PR_NUM}.${RUN_NUM}"
          echo "dev_version=${DEV_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set dev version in packages
        if: steps.affected.outputs.has_affected == 'true'
        run: |
          VERSION="${{ steps.version.outputs.dev_version }}"
          for pkg_json in $(find packages -name 'package.json' -maxdepth 2); do
            node -e "
              const fs = require('fs');
              const pkg = JSON.parse(fs.readFileSync('$pkg_json', 'utf8'));
              pkg.version = '$VERSION';
              fs.writeFileSync('$pkg_json', JSON.stringify(pkg, null, 2) + '\n');
            "
          done

      - name: Build affected
        if: steps.affected.outputs.has_affected == 'true'
        run: npx nx affected -t build

      - name: Check uniqueness on AR
        if: steps.affected.outputs.has_affected == 'true'
        run: |
          VERSION="${{ steps.version.outputs.dev_version }}"
          for pkg in $(npx nx show projects --affected); do
            PKG_NAME="@bhs-dev/${pkg}"
            if gcloud artifacts versions describe "${VERSION}" \
              --package="${PKG_NAME}" \
              --repository=typescript-packages-dev \
              --location=us-central1 2>/dev/null; then
              echo "ERRO: ${PKG_NAME}@${VERSION} ja existe no AR"
              exit 1
            fi
          done

      - name: Configure npm for AR
        if: steps.affected.outputs.has_affected == 'true'
        run: |
          AR_URL="https://${AR_REGISTRY}/"
          # 1. Configura registry do scope no .npmrc do projeto
          npm config set @bhs-dev:registry "${AR_URL}" --location=project
          # 2. Gera auth tokens no .npmrc do usuario (~/.npmrc) a partir das credenciais WIF
          npx google-artifactregistry-auth --repo-config=.npmrc --credential-config=.npmrc
          # 3. Mostra config para debug (sem tokens)
          echo "--- .npmrc (projeto) ---"
          cat .npmrc
          echo "--- registry config ---"
          npm config get @bhs-dev:registry

      - name: Publish to AR
        if: steps.affected.outputs.has_affected == 'true'
        run: |
          npx nx release publish \
            --tag=dev \
            --first-release
